<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запрос от клиента</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol';
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .header {
            background-color: rgba(255, 165, 0, 0.1);
            padding: 40px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            color: #333;
            font-size: 24px;
        }
        .content {
            padding: 30px;
            color: #555;
            line-height: 1.6;
        }
        .content p {
            margin: 0 0 15px;
        }
        .highlight {
            color: #ff6f00;
            font-weight: bold;
        }
        .footer {
            background-color: #f9f9f9;
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Новый запрос от клиента</h1>
    </div>
    <div class="content">
        <p>Здравствуйте,</p>
        <p>Поступил новый запрос от клиента, связанный с <span class="highlight">{{.ResourceType}}</span> (ID: {{.RelatedResourceID}}).</p>
        <p><strong>Текст запроса:</strong> {{.Text}}</p>
    </div>
    <div class="footer">
        <p>&copy; 2025 Symbio</p>
    </div>
</div>
</body>
</html>
